# Patch bumps merge themselves once `validate` passes (.github/workflows/dependabot-auto-merge.yml).
# Minor bumps come as one grouped PR per ecosystem for review; majors come one PR each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Majors wait for review one PR each; the default limit of 5 let them block the patch group.
    open-pull-requests-limit: 15
    schedule:
      interval: weekly
    groups:
      npm-patch:
        update-types: [patch]
      npm-minor:
        update-types: [minor]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-npm-patch:
        update-types: [patch]
      server-npm-minor:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]
