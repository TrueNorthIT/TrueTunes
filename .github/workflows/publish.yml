name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # dorny/test-reporter
      checks: write # dorny/test-reporter creates the check run
      pull-requests: write # vitest-coverage-report-action comments on the PR

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci

      # The `stories` Vitest project renders every Storybook story in real Chromium.
      # Browser only: ubuntu-latest ships Google Chrome, so Chromium's system libraries are already there. --with-deps
      # added an apt install from the Ubuntu mirror that sometimes crawled (11-12 min instead of ~20 s).
      - run: npx playwright install chromium

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run build

      - run: npm run test:main

      - name: Test with coverage
        run: >
          npm run test:run --
          --reporter=default
          --reporter=junit
          --outputFile.junit=./junit.xml
          --coverage

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest Tests
          path: renderer/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          json-summary-path: renderer/coverage/coverage-summary.json
          json-final-path: renderer/coverage/coverage-final.json
          vite-config-path: renderer/vitest.config.ts

      - name: Server (Azure Functions) tests and build
        working-directory: server
        run: |
          npm ci
          npm test
          npm run build

  # Applies the Terraform in infra/ and publishes the functions in server/, for the commit that was pushed.
  # `version` (and so `publish`, the desktop release) needs this job: a new app build may call a new function or
  # setting, so the release must not go out unless both succeeded. Runs for every push to main, Dependabot merges
  # included, since those change what is deployed too.
  # Signs in as the truetunes-ci-deploy managed identity by OIDC: the federated credential accepts only this
  # repository's `production` environment, so there is no Azure secret in GitHub. See infra/README.md.
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One apply at a time. A run waiting behind another is replaced by a newer one; the newer commit contains the
    # older, so nothing is lost.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # azure/login and the azurerm provider/backend request the OIDC token
    env:
      # azurerm provider and backend: sign in with the GitHub OIDC token, not the Azure CLI.
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}
      TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
      TF_VAR_auth_enforce: ${{ vars.AUTH_ENFORCE }}
      # JSON list of object ids, e.g. ["<object id>"]; [] when the variable is unset.
      TF_VAR_key_vault_secrets_officers: ${{ vars.KEY_VAULT_SECRETS_OFFICERS || '[]' }}
      TF_IN_AUTOMATION: 'true'

    steps:
      # The pushed commit itself (github.sha), never a branch head that moved on while the job waited.
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.12'
          terraform_wrapper: false

      - name: Terraform init, format and validate
        working-directory: infra
        run: |
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate

      # The plan is saved and applied as is, so what runs is what was planned. No raw plan is printed: the Function
      # App's app_settings and the provider's keys are in it. Only resource addresses and actions go to the log.
      - name: Terraform plan
        working-directory: infra
        run: |
          terraform plan -input=false -lock-timeout=10m -out=tfplan -no-color > plan.log 2>&1 || { cat plan.log; exit 1; }
          terraform show -json tfplan | jq -r '
            [.resource_changes[]? | select((.change.actions != ["no-op"] and .change.actions != ["read"]) or .change.importing != null)] as $c
            | ($c[] | "\(.change.actions | join("+")) \(.address)"),
              "Plan: \([$c[] | select(.change.actions | index("create"))] | length) to add, \([$c[] | select(.change.actions == ["update"])] | length) to change, \([$c[] | select(.change.actions | index("delete"))] | length) to destroy."
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -lock-timeout=10m tfplan

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Build and test the functions
        working-directory: server
        run: |
          npm ci
          npm test
          npm run build
          npm prune --omit=dev

      # The Function App's own Node version stays ~22 (infra/functions.tf); this runner's Node only builds.
      # `func publish` replaces every function with this checkout's, which is why it only ever runs from main.
      - name: Publish the functions
        working-directory: server
        run: |
          npm install --global azure-functions-core-tools@4
          func azure functionapp publish "$(terraform -chdir=../infra output -raw function_app_name)" --javascript

      - name: Smoke check
        run: |
          url="$(terraform -chdir=infra output -raw function_app_url)/api/attribution"
          curl --silent --show-error --fail --retry 8 --retry-delay 15 --retry-all-errors --max-time 30 --output /dev/null "$url"
          echo "$url answered 2xx"

  version:
    # deploy: the release waits for the infra apply and the function publish of the same commit (a skipped or failed
    # deploy skips this job, and so publish).
    needs: [validate, deploy]
    # No release for a Dependabot merge: its update lands on main and ships with the next human-merged release.
    # Auto-merges (GITHUB_TOKEN) start no run at all, but a person merging a Dependabot PR does, and github.actor
    # is then that person. So look at the pushed commit instead:
    #   - squash/rebase merge: the commit's author is dependabot[bot] (e.g. 6334b11, #166, merged by hand);
    #   - merge commit: the message is "Merge pull request #N from <owner>/dependabot/...".
    # Skipping version also skips publish (needs: version).
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.author.name != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, format('from {0}/dependabot/', github.repository_owner))
    # One release at a time, so two merges close together bump 1.0.N and 1.0.N+1 instead of colliding. GitHub keeps
    # only one pending job per group: a third merge replaces the second's pending job, and its release includes both.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      # Pushes with a deploy key that may bypass the main ruleset. Deploy-key pushes DO trigger
      # workflows, so the bump commit carries [skip ci] to stop a publish loop.
      # Check out the branch head, not the triggering sha: anything merged while validate ran (e.g. a Dependabot
      # auto-merge) would otherwise make the push non-fast-forward and lose the release. Every commit on main has
      # already passed validate as a required PR check, and those later commits ship in this release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.VERSION_BUMP_DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "new_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # The publish job uploads into this draft. Left to electron-builder, parallel publish jobs each created their own
      # draft, which split 1.0.62 and 1.0.63 across two drafts.
      - name: Create the draft release
        run: >-
          gh release create "v${{ steps.bump.outputs.new_version }}" --draft
          --title "${{ steps.bump.outputs.new_version }}" --target "${{ steps.push.outputs.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    if: github.event_name == 'push'
    # Windows only: nobody runs the macOS build, and macOS runners bill at 10x.
    runs-on: windows-latest
    permissions:
      contents: write # electron-builder uploads the GitHub release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run electron:publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
