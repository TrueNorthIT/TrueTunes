name: Dependabot auto-merge

# Patch bumps (x.y.Z) merge themselves once the required `validate` check passes; minors and majors wait for a person.
# The merge is made with GITHUB_TOKEN, which starts no workflows, so it doesn't bump the version or build a release:
# patches ship with the next human merge to main.
# A Dependabot PR merged by hand does start publish.yml; its version job skips Dependabot merges for the same result.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
