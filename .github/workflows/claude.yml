name: Claude

# Mention @claude in a PR or issue comment, a review, or a new issue, and Claude works on it on a GitHub runner: answers
# questions, reviews, or pushes commits to the PR branch (on an issue, it opens a branch). Only people with write access
# can trigger it. Pushes go through the Claude GitHub App, so `validate` runs on them. Uses CLAUDE_CODE_OAUTH_TOKEN, as
# dependabot-fix.yml does.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # Claude GitHub App token
      actions: read # CI logs
      checks: read # gh pr checks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for the read-only gh calls; pushes use the Claude GitHub App
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm ci:*),Bash(npm run:*),Bash(npx tsc:*),Bash(npx eslint:*),Bash(npx vitest:*),Bash(npx prettier:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(npx playwright install:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*)"
            --append-system-prompt "Read CLAUDE.md first; it is authoritative. This is a fresh Linux runner: install with npm ci --ignore-scripts at the root (and in server/ if you touch it). Fast checks: npm run typecheck, npm run lint, npm run test:main, and the jsdom tests with npx vitest run --config renderer/vitest.config.ts --project unit [files]. The stories project needs Chromium: run npx playwright install --with-deps chromium first, and only if you changed components or stories. CI (publish.yml validate) runs the full suite on every push, so run only what covers your change. There is no Sonos, Electron window or Azure here: never deploy or run az or func. Write in UK English."
