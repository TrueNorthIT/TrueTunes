name: Mobile CI

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Catches Expo SDK / native dependency mismatches before they become a broken build.
      - run: npx expo-doctor

      - name: Test with coverage
        run: >
          npm run test:run --
          --reporter=default
          --reporter=junit
          --outputFile.junit=./junit.xml
          --coverage

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Mobile Vitest Tests
          path: apps/mobile/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          name: Mobile
          json-summary-path: apps/mobile/coverage/coverage-summary.json
          json-final-path: apps/mobile/coverage/coverage-final.json
          vite-config-path: apps/mobile/vitest.config.ts
