name: UI screenshots

# On a PR that changes UI code: before (base) and after (this PR) screenshots of every Storybook story the change
# affects, with the changed areas boxed, in one PR comment that each push updates. Stories are found through the import
# graph of the Storybook build (scripts/ui-screenshots/). The images go on the orphan `pr-screenshots` branch under
# pr-<n>/<sha>/; GITHUB_TOKEN pushes start no workflows, and publish.yml only runs on main anyway. Closing the PR
# deletes its folder. Not for Dependabot or forks (a fork's token can't push or comment).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # warm-cache: a cache saved by a PR run is visible to that PR only, so the browser is cached from main for every PR.
  push:
    branches: [main]
    paths: [package-lock.json, .github/workflows/ui-screenshots.yml]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ui-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warm-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only the download: nothing launches the browser here, so no system libraries.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx -y "playwright@${{ steps.playwright.outputs.version }}" install chromium

  screenshots:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push to pr-screenshots
      pull-requests: write # the comment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      # The PR merged into its base, so HEAD^1 is the base it is compared with and the diff is only the PR's changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Changed files
        id: changed
        run: |
          echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          git diff --name-only --no-renames HEAD^1 HEAD | tee "$RUNNER_TEMP/changed.txt"
          if grep -q '^renderer/' "$RUNNER_TEMP/changed.txt"; then echo "ui=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.changed.outputs.ui
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - if: steps.changed.outputs.ui
        run: npm ci

      # The browser comes from a cache keyed on the Playwright version; the system libraries still come from apt.
      - name: Playwright version
        id: playwright
        if: steps.changed.outputs.ui
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        if: steps.changed.outputs.ui
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.changed.outputs.ui && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.changed.outputs.ui && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The base is built with its own Storybook config and stories but screenshotted by this PR's scripts, which
      # don't exist on the base yet. It shares this checkout's node_modules unless the PR changes the lockfile.
      - name: Build Storybook for this PR and its base
        if: steps.changed.outputs.ui
        run: |
          npx storybook build -c renderer/.storybook -o "$RUNNER_TEMP/sb-head" --stats-json "$RUNNER_TEMP/sb-head" --quiet
          git worktree add -q "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          if git diff --quiet HEAD "$GITHUB_SHA" -- package-lock.json; then
            ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          else
            npm ci
          fi
          npx storybook build -c renderer/.storybook -o "$RUNNER_TEMP/sb-base" --stats-json "$RUNNER_TEMP/sb-base" --quiet

      - name: Screenshot the affected stories
        id: shots
        if: steps.changed.outputs.ui
        env:
          DIR: pr-${{ github.event.pull_request.number }}/${{ steps.changed.outputs.short }}
        run: |
          node scripts/ui-screenshots/run.mjs \
            --base "$RUNNER_TEMP/sb-base" --head "$RUNNER_TEMP/sb-head" --changed "$RUNNER_TEMP/changed.txt" \
            --out "$RUNNER_TEMP/shots/$DIR" --sha "${HEAD_SHA::7}" --base-name "$BASE_REF" \
            --url "https://github.com/$GITHUB_REPOSITORY/blob/pr-screenshots/$DIR/"
          if [ -f "$RUNNER_TEMP/shots/$DIR/comment.md" ]; then echo "body=$RUNNER_TEMP/shots/$DIR/comment.md" >> "$GITHUB_OUTPUT"; fi

      # Replaces this PR's folder on pr-screenshots (creating the branch if it is missing). Another PR's run may push
      # in between, so on a rejected push it starts again from the new tip.
      - name: Publish the images
        if: steps.shots.outputs.body
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin pr-screenshots; then
              git checkout -qf --detach FETCH_HEAD
            else
              git checkout -qf --orphan "pr-screenshots-$attempt"
              git rm -rq --cached .
            fi
            rm -rf "pr-$PR"
            cp -r "$RUNNER_TEMP/shots/pr-$PR" "pr-$PR"
            rm "pr-$PR"/*/comment.md
            git add -A "pr-$PR"
            git commit -qm "Screenshots for PR #$PR at ${HEAD_SHA::7}"
            git push -q origin HEAD:refs/heads/pr-screenshots && exit 0
          done
          exit 1

      # One comment per PR, found by its marker. A push that no longer affects any story updates it rather than
      # leaving old screenshots up; a PR that never touched a story gets none.
      - name: Comment
        env:
          BODY: ${{ steps.shots.outputs.body }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ui-screenshots -->"))) | .id' | sed -n 1p)
          if [ -z "$BODY" ]; then
            [ -n "$id" ] || exit 0
            BODY="$RUNNER_TEMP/none.md"
            printf '<!-- ui-screenshots -->\n### UI screenshots\n\nNo story is affected at %s.\n' "${HEAD_SHA::7}" > "$BODY"
          fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$BODY" --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$BODY" --silent
          fi

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
        continue-on-error: true # no pr-screenshots branch yet: nothing to delete
        with:
          ref: pr-screenshots

      - name: Delete this PR's screenshots
        if: steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q --depth 1 origin pr-screenshots
            git checkout -qf --detach FETCH_HEAD
            [ -d "pr-$PR" ] || exit 0
            git rm -rq "pr-$PR"
            git commit -qm "Remove the screenshots for PR #$PR"
            git push -q origin HEAD:refs/heads/pr-screenshots && exit 0
          done
          exit 1
